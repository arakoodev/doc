<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-gateway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9C1D7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#D9C1D7;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="grad-gateway-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9C1D7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#D9C1D7;stop-opacity:0.3" />
    </linearGradient>

    <linearGradient id="grad-worker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86728C;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#86728C;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="grad-worker-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86728C;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#86728C;stop-opacity:0.3" />
    </linearGradient>

    <linearGradient id="grad-storage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9B9A7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#D9B9A7;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="grad-storage-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9B9A7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#D9B9A7;stop-opacity:0.3" />
    </linearGradient>

    <linearGradient id="grad-box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.02" />
    </linearGradient>
    
    <linearGradient id="grad-pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Arrow Marker -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 L4,6 Z" fill="#E5D5E1" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1px" style="text-shadow: 0 0 20px rgba(255,255,255,0.3);">FINANCIAL OPERATING SYSTEM</text>
  
  <!-- === LAYERS === -->
  
  <!-- Real-Time Layer -->
  <g transform="translate(50, 100)">
    <rect width="1100" height="180" rx="16" fill="url(#grad-gateway)" stroke="url(#grad-gateway-stroke)" stroke-width="1.5" />
    <text x="30" y="30" font-size="14" font-weight="bold" fill="#D9C1D7" letter-spacing="1px">REAL-TIME LAYER (GATEWAY)</text>
    
    <!-- Gateway Box -->
    <g transform="translate(400, 40)">
      <rect width="300" height="110" rx="12" fill="url(#grad-box)" stroke="#D9C1D7" stroke-width="2" filter="url(#glow)" />
      <text x="150" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Gateway Service</text>
      <text x="150" y="65" text-anchor="middle" font-size="14" fill="#E5D5E1">Proxy &amp; Metering</text>
      <path d="M150,80 L150,90 M145,85 L155,85" stroke="#D9C1D7" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Credit Logic -->
    <g transform="translate(80, 55)">
      <rect width="220" height="80" rx="8" fill="url(#grad-box)" stroke="#D9C1D7" stroke-width="1" stroke-dasharray="4 4" />
      <text x="110" y="35" text-anchor="middle" font-weight="bold" fill="#ffffff">Credit Guardrails</text>
      <text x="110" y="55" text-anchor="middle" font-size="12" fill="#E5D5E1">Prepaid/Postpaid Check</text>
    </g>

    <!-- Material Logic -->
    <g transform="translate(800, 55)">
      <rect width="220" height="80" rx="8" fill="url(#grad-box)" stroke="#D9C1D7" stroke-width="1" stroke-dasharray="4 4" />
      <text x="110" y="35" text-anchor="middle" font-weight="bold" fill="#ffffff">Material Determination</text>
      <text x="110" y="55" text-anchor="middle" font-size="12" fill="#E5D5E1">Token → SKU Mapping</text>
    </g>

    <!-- Connections within Real-Time Layer -->
    <line x1="300" y1="95" x2="400" y2="95" stroke="#D9C1D7" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="700" y1="95" x2="800" y2="95" stroke="#D9C1D7" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <!-- Async Layer -->
  <g transform="translate(50, 310)">
    <rect width="1100" height="300" rx="16" fill="url(#grad-worker)" stroke="url(#grad-worker-stroke)" stroke-width="1.5" />
    <text x="30" y="30" font-size="14" font-weight="bold" fill="#86728C" letter-spacing="1px">ASYNC ACCOUNTING (WORKER)</text>

    <!-- Job Runners Box -->
    <g transform="translate(200, 60)">
      <rect width="700" height="200" rx="12" fill="url(#grad-box)" stroke="#86728C" stroke-width="2" filter="url(#glow)" />
      <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Job Runners &amp; Financial Logic</text>
      
      <!-- Event Driven Jobs -->
      <g transform="translate(30, 50)">
        <text x="0" y="0" font-size="12" font-weight="bold" fill="#E5D5E1" text-decoration="underline">Event Driven</text>
        <rect x="0" y="15" width="140" height="25" rx="4" fill="url(#grad-pill)" />
        <text x="70" y="32" text-anchor="middle" font-size="11" fill="#ffffff">usage_event</text>
        
        <rect x="0" y="45" width="140" height="25" rx="4" fill="url(#grad-pill)" />
        <text x="70" y="62" text-anchor="middle" font-size="11" fill="#ffffff">rate_usage</text>
      </g>

      <!-- Billing Cycle Jobs -->
      <g transform="translate(200, 50)">
         <text x="0" y="0" font-size="12" font-weight="bold" fill="#E5D5E1" text-decoration="underline">Billing Cycle</text>
        <rect x="0" y="15" width="140" height="25" rx="4" fill="url(#grad-pill)" />
        <text x="70" y="32" text-anchor="middle" font-size="11" fill="#ffffff">generate_inv</text>
        
        <rect x="0" y="45" width="140" height="25" rx="4" fill="url(#grad-pill)" />
        <text x="70" y="62" text-anchor="middle" font-size="11" fill="#ffffff">dunning_run</text>
        
        <rect x="0" y="75" width="140" height="25" rx="4" fill="url(#grad-pill)" />
        <text x="70" y="92" text-anchor="middle" font-size="11" fill="#ffffff">period_close</text>
      </g>
      
      <!-- Accounting Jobs -->
      <g transform="translate(370, 50)">
         <text x="0" y="0" font-size="12" font-weight="bold" fill="#E5D5E1" text-decoration="underline">Accounting</text>
        <rect x="0" y="15" width="140" height="25" rx="4" fill="url(#grad-pill)" />
        <text x="70" y="32" text-anchor="middle" font-size="11" fill="#ffffff">recognize_rev</text>
        
        <rect x="0" y="45" width="140" height="25" rx="4" fill="url(#grad-pill)" />
        <text x="70" y="62" text-anchor="middle" font-size="11" fill="#ffffff">calc_profit</text>
      </g>
      
      <!-- Logic Labels -->
      <g transform="translate(540, 60)">
          <path d="M0,0 L0,80" stroke="#86728C" stroke-width="1" stroke-dasharray="2 2" />
          <text x="10" y="20" font-size="11" fill="#C7AECA">DR: Accounts Rec.</text>
          <text x="10" y="35" font-size="11" fill="#C7AECA">CR: Revenue</text>
          <text x="10" y="60" font-size="11" fill="#C7AECA">DR: COGS</text>
          <text x="10" y="75" font-size="11" fill="#C7AECA">CR: Accounts Pay.</text>
      </g>
    </g>

    <!-- Idempotent Queue Infrastructure Pill -->
    <g transform="translate(450, -15)">
      <rect width="200" height="30" rx="15" fill="#210F26" stroke="#86728C" stroke-width="2" />
      <text x="100" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Idempotent Queue Infrastructure</text>
    </g>

  </g>

  <!-- Global Connection: Async to Storage -->
  <line x1="600" y1="570" x2="600" y2="650" stroke="#D9B9A7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Storage Layer -->
  <g transform="translate(50, 650)">
    <rect width="1100" height="200" rx="16" fill="url(#grad-storage)" stroke="url(#grad-storage-stroke)" stroke-width="1.5" />
    <text x="30" y="30" font-size="14" font-weight="bold" fill="#D9B9A7" letter-spacing="1px">SYSTEM OF RECORD</text>

    <!-- Control DB -->
    <g transform="translate(150, 50)">
      <path d="M0,15 C0,7 45,0 100,0 C155,0 200,7 200,15 L200,105 C200,113 155,120 100,120 C45,120 0,113 0,105 Z" fill="url(#grad-box)" stroke="#D9B9A7" stroke-width="2" />
      <path d="M0,15 C0,23 45,30 100,30 C155,30 200,23 200,15" fill="none" stroke="#D9B9A7" stroke-width="1" />
      <text x="100" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Control DB</text>
      <text x="100" y="75" text-anchor="middle" font-size="12" fill="#D9B9A7">(PostgreSQL)</text>
      <text x="100" y="95" text-anchor="middle" font-size="11" fill="#E5D5E1">Customers • Contracts</text>
      <text x="100" y="110" text-anchor="middle" font-size="11" fill="#E5D5E1">Credits • Invoices</text>
    </g>

    <!-- Ledger DB -->
    <g transform="translate(450, 50)">
      <path d="M0,15 C0,7 45,0 100,0 C155,0 200,7 200,15 L200,105 C200,113 155,120 100,120 C45,120 0,113 0,105 Z" fill="url(#grad-box)" stroke="#D9B9A7" stroke-width="2" filter="url(#glow)" />
      <path d="M0,15 C0,23 45,30 100,30 C155,30 200,23 200,15" fill="none" stroke="#D9B9A7" stroke-width="1" />
      <text x="100" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Ledger DB</text>
      <text x="100" y="75" text-anchor="middle" font-size="12" fill="#D9B9A7">(PostgreSQL)</text>
      <text x="100" y="95" text-anchor="middle" font-size="11" fill="#E5D5E1">Materials • Prices</text>
      <text x="100" y="110" text-anchor="middle" font-size="11" fill="#E5D5E1">pgledger • Events</text>
    </g>

    <!-- Analytics DB -->
    <g transform="translate(750, 50)">
      <path d="M0,15 C0,7 45,0 100,0 C155,0 200,7 200,15 L200,105 C200,113 155,120 100,120 C45,120 0,113 0,105 Z" fill="url(#grad-box)" stroke="#D9B9A7" stroke-width="2" />
      <path d="M0,15 C0,23 45,30 100,30 C155,30 200,23 200,15" fill="none" stroke="#D9B9A7" stroke-width="1" />
      <text x="100" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Analytics DB</text>
      <text x="100" y="75" text-anchor="middle" font-size="12" fill="#D9B9A7">(TimescaleDB)</text>
      <text x="100" y="95" text-anchor="middle" font-size="11" fill="#E5D5E1">Time-series • Aggregates</text>
      <text x="100" y="110" text-anchor="middle" font-size="11" fill="#E5D5E1">Reports • Dashboards</text>
    </g>
  </g>

</svg>